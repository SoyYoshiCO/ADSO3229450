<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Linear Gradient</title>

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #e6e6e6;
}

.contenedor{
    width: 400px;
    height: 200px;
    margin: 50px;

    /* Cambia este gradiente por el que necesites */
    background: linear-gradient(25deg, #f20000, #ffffff, #0800ff);

    border: 2px solid black;
    border-radius: 0px;
}
</style>

</head>
<body>

<div class="contenedor"></div>

</body>
</html>
